# This file is auto-generated by the Mailu configuration wizard.
# Please read the documentation before attempting any change.
# Generated for compose flavor

services:

  # External dependencies
  redis:
    image: redis:alpine
    restart: always
    volumes:
      - "${VOLUMES_DIR}/redis:/data"
    depends_on:
      - resolver
    dns:
      - ${RESOLVER_IP}

  certdumper:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/traefik-certdumper:master
    restart: always
    env_file:
      - mailu.env
    environment:
      # Make sure this is the same as the main=-domain in traefik.toml
      - DOMAIN=${DOMAINNAME}
      # v2 even with traefik 3, see https://github.com/ldez/traefik-certs-dumper/issues/205
      - TRAEFIK_VERSION=v2
    volumes:
      # Folder, which contains the acme.json
      - "${TRAEFIK_ACME_DIR}:/traefik"
      # Folder, where cert.pem and key.pem will be written
      - "${VOLUMES_DIR}/certs:/output"

  # Core services
  front:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}nginx:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-front
    ports:
      - "${SERVER_IPV4}:25:25"
      - "${SERVER_IPV4}:465:465"
      - "${SERVER_IPV4}:587:587"
      - "${SERVER_IPV4}:110:110"
      - "${SERVER_IPV4}:995:995"
      - "${SERVER_IPV4}:143:143"
      - "${SERVER_IPV4}:993:993"
    networks:
      - default
      - webmail
      - traefik
    volumes:
      - "${VOLUMES_DIR}/certs:/certs"
      - "${VOLUMES_DIR}/overrides/nginx:/overrides:ro"
    labels:
      - traefik.enable=true

      - traefik.http.routers.${SERVICENAME}.rule=Host(`${SERVICENAME}.${DOMAINNAME}`) || HostRegexp(`^mailu\.`) || HostRegexp(`^mail\.`) || HostRegexp(`^autoconfig\.`)
      - traefik.http.routers.${SERVICENAME}.middlewares=default@file
      - traefik.http.routers.${SERVICENAME}.priority=100
      - traefik.http.routers.${SERVICENAME}.service=${SERVICENAME}

      - traefik.http.routers.mailbox-selector.rule=(Host(`${SERVICENAME}.${DOMAINNAME}`) || HostRegexp(`^mailu\.`) || HostRegexp(`^mail\.`)) && PathPrefix(`/sso/`)
      - traefik.http.routers.mailbox-selector.middlewares=stripremoteauth@file,authelia@docker,mailbox-selector@docker,secheader@file
      - traefik.http.routers.mailbox-selector.priority=200
      - traefik.http.routers.mailbox-selector.service=${SERVICENAME}

      - traefik.http.middlewares.mailbox-selector.forwardauth.addAuthCookiesToResponse=mailbox-token
      - traefik.http.middlewares.mailbox-selector.forwardauth.address=http://mitglieder:8080/mailu-login.php
      - traefik.http.middlewares.mailbox-selector.forwardauth.authResponseHeaders=Remote-Email

      - traefik.http.services.${SERVICENAME}.loadbalancer.server.port=80
    depends_on:
      - resolver
    dns:
      - ${RESOLVER_IP}

  resolver:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}unbound:${MAILU_VERSION:-2024.06}
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-resolver
    restart: always
    networks:
      default:
        ipv4_address: ${RESOLVER_IP}

  admin:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}admin:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-admin
    volumes:
      - "${VOLUMES_DIR}/data:/data"
      - "${VOLUMES_DIR}/dkim:/dkim"
    depends_on:
      - redis
      - resolver
    dns:
      - ${RESOLVER_IP}

  imap:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}dovecot:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-imap
    volumes:
      - "${VOLUMES_DIR}/mail:/mail"
      - "${VOLUMES_DIR}/overrides/dovecot:/overrides:ro"
    networks:
      - default
    depends_on:
      - front
      - resolver
    dns:
      - ${RESOLVER_IP}

  smtp:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}postfix:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-smtp
    volumes:
      - "${VOLUMES_DIR}/mailqueue:/queue"
      - "${VOLUMES_DIR}/overrides/postfix:/overrides:ro"
    depends_on:
      - front
      - resolver
    dns:
      - ${RESOLVER_IP}

  oletools:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}oletools:${MAILU_VERSION:-2024.06}
    hostname: oletools
    logging:
      driver: journald
      options:
        tag: mailu-oletools
    restart: always
    networks:
      - oletools
    depends_on:
      - resolver
    dns:
      - ${RESOLVER_IP}


  antispam:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}rspamd:${MAILU_VERSION:-2024.06}
    hostname: antispam
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-antispam
    networks:
      - default
      - oletools
      - clamav
    volumes:
      - "${VOLUMES_DIR}/filter:/var/lib/rspamd"
      - "${VOLUMES_DIR}/overrides/rspamd:/overrides:ro"
    depends_on:
      - front
      - redis
      - oletools
      - antivirus
      - resolver
    dns:
      - ${RESOLVER_IP}

  # Optional services
  antivirus:
    image: clamav/clamav-debian:stable
    restart: always
    logging:
      driver: journald
      options:
        tag: mailu-antivirus
    networks:
      - clamav
    volumes:
      - "${VOLUMES_DIR}/clamav:/var/lib/clamav"



  # Webmail
  webmail:
    image: ${DOCKER_ORG:-ghcr.io/mailu}/${DOCKER_PREFIX:-}webmail:${MAILU_VERSION:-2024.06}
    restart: always
    env_file: mailu.env
    logging:
      driver: journald
      options:
        tag: mailu-webmail
    volumes:
      - "${VOLUMES_DIR}/webmail:/data"
      - "${VOLUMES_DIR}/overrides/roundcube:/overrides:ro"
    networks:
      - webmail
    depends_on:
      - front

networks:
  default:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${MAILU_SUBNET}
  webmail:
    driver: bridge
  clamav:
    driver: bridge
  oletools:
    driver: bridge
    internal: true
  traefik:
    name: traefik
    external: true
